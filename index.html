<!DOCTYPE html>
<html lang="id" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk / Daftar - Kas Warga</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBg7BB8LG9Nk2yva4BEtqXggIPB8-o4yZg", // GANTI dengan API KEY ANDA
          authDomain: "user-b44ff.firebaseapp.com",
          projectId: "user-b44ff", // GANTI dengan PROJECT ID ANDA
          storageBucket: "user-b44ff.firebasestorage.app",
          messagingSenderId: "267328832825",
          appId: "1:267328832825:web:2212487f6b2106275cd4e8", 
          measurementId: "G-LSZLNVL3ZB"
        };
        
        const app = firebase.initializeApp(firebaseConfig);
        const db = app.firestore();
        const WARGA_COLLECTION = db.collection('warga');
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        body { background-color: #f7f9fc; }
        .auth-container { 
            max-width: 420px; 
            margin: 0 auto; 
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        .dark body { background-color: #111827; }
        .dark .auth-container { background-color: #1f2937; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">

    <div class="auth-container p-6 flex flex-col justify-center items-center">
        
        <h1 class="text-4xl font-extrabold mb-10 text-blue-600 dark:text-blue-400">Kas Warga RT 01</h1>
        
        <div class="flex w-full max-w-sm mb-8 bg-gray-100 dark:bg-gray-700 rounded-xl p-1 shadow-inner">
            <button id="tab-login" class="flex-1 py-3 font-semibold rounded-lg transition-all duration-300 bg-white text-blue-600 shadow-md dark:bg-gray-800 dark:text-blue-400">Masuk</button>
            <button id="tab-register" class="flex-1 py-3 font-semibold rounded-lg transition-all duration-300 text-gray-500 dark:text-gray-400">Daftar</button>
        </div>

        <div id="card-login" class="w-full max-w-sm bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl transition-all duration-500">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-gray-100">Masuk Aplikasi</h2>
            <form id="form-login">
                <div class="mb-4">
                    <label for="login-email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
                    <input type="email" id="login-email" placeholder="contoh: admin1@gmail.com" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-gray-100" required>
                </div>
                <div class="mb-6">
                    <label for="login-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                    <input type="password" id="login-password" placeholder="contoh: 123456" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-gray-100" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition duration-150 shadow-lg shadow-blue-500/50">MASUK</button>
            </form>
            <p class="text-sm text-center mt-4 text-gray-500 dark:text-gray-400">Tidak punya akun? <button class="text-blue-600 dark:text-blue-400 font-semibold" onclick="switchTab('register')">Daftar di sini.</button></p>
        </div>

        <div id="card-register" class="w-full max-w-sm bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl transition-all duration-500 hidden absolute transform translate-y-full">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-gray-100">Pendaftaran Warga Baru</h2>
            <form id="form-register">
                <div class="mb-4">
                    <label for="reg-nama" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nama Lengkap</label>
                    <input type="text" id="reg-nama" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-gray-100" required>
                </div>
                <div class="mb-4">
                    <label for="reg-alamat" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Alamat / Blok Rumah</label>
                    <input type="text" id="reg-alamat" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-gray-100" required>
                </div>
                
                <div class="mb-4">
                    <label for="reg-role" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tingkat Akses (Role)</label>
                    <select id="reg-role" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-gray-100 appearance-none" required>
                        <option value="member">Member (Hanya lihat)</option>
                        <option value="admin">Admin (Akses penuh)</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label for="reg-email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email (Untuk Login)</label>
                    <input type="email" id="reg-email" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-gray-100" required>
                </div>
                <div class="mb-6">
                    <label for="reg-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                    <input type="password" id="reg-password" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-gray-100" required>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition duration-150 shadow-lg shadow-green-500/50">DAFTAR & SIMPAN</button>
            </form>
            <p class="text-sm text-center mt-4 text-gray-500 dark:text-gray-400">Sudah punya akun? <button class="text-blue-600 dark:text-blue-400 font-semibold" onclick="switchTab('login')">Masuk.</button></p>
        </div>
        
        <div id="notification-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 max-w-xs w-full z-50">
            </div>

    </div>

    <script>
        const cardLogin = document.getElementById('card-login');
        const cardRegister = document.getElementById('card-register');
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');

        // Fungsi untuk menampilkan notifikasi (sama seperti di app.js)
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            
            let bgColor, textColor, icon;
            if (type === 'success') {
                bgColor = 'bg-green-500';
                textColor = 'text-white';
                icon = '✅';
            } else if (type === 'error') {
                bgColor = 'bg-red-500';
                textColor = 'text-white';
                icon = '❌';
            } else {
                bgColor = 'bg-blue-500';
                textColor = 'text-white';
                icon = 'ℹ️';
            }

            notification.className = `p-3 mb-2 rounded-lg shadow-lg flex items-center space-x-2 ${bgColor} ${textColor} opacity-0 transform transition-all duration-300`;
            notification.innerHTML = `<span class="font-bold">${icon}</span> <span>${message}</span>`;
            
            container.appendChild(notification);

            setTimeout(() => {
                notification.classList.remove('opacity-0');
            }, 10);

            setTimeout(() => {
                notification.classList.add('opacity-0');
                setTimeout(() => notification.remove(), 500);
            }, 4000);
        }

        // Fungsi untuk berpindah antara tab Login dan Daftar
        function switchTab(tab) {
            if (tab === 'login') {
                cardLogin.classList.remove('hidden', 'translate-y-full');
                cardRegister.classList.add('hidden', 'translate-y-full');
                tabLogin.classList.add('bg-white', 'text-blue-600', 'shadow-md', 'dark:bg-gray-800', 'dark:text-blue-400');
                tabLogin.classList.remove('text-gray-500', 'dark:text-gray-400');
                tabRegister.classList.remove('bg-white', 'text-blue-600', 'shadow-md', 'dark:bg-gray-800', 'dark:text-blue-400');
                tabRegister.classList.add('text-gray-500', 'dark:text-gray-400');
            } else {
                cardRegister.classList.remove('hidden', 'translate-y-full');
                cardLogin.classList.add('hidden', 'translate-y-full');
                tabRegister.classList.add('bg-white', 'text-blue-600', 'shadow-md', 'dark:bg-gray-800', 'dark:text-blue-400');
                tabRegister.classList.remove('text-gray-500', 'dark:text-gray-400');
                tabLogin.classList.remove('bg-white', 'text-blue-600', 'shadow-md', 'dark:bg-gray-800', 'dark:text-blue-400');
                tabLogin.classList.add('text-gray-500', 'dark:text-gray-400');
            }
        }

        // Listener untuk tab switcher
        tabLogin.addEventListener('click', () => switchTab('login'));
        tabRegister.addEventListener('click', () => switchTab('register'));


        // =======================================================
        // HANDLE PENDAFTARAN (REGISTER)
        // =======================================================
        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nama = document.getElementById('reg-nama').value.trim();
            const alamat = document.getElementById('reg-alamat').value.trim();
            const role = document.getElementById('reg-role').value; // ⬅️ NEW: Ambil role
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if (!nama || !alamat || !email || !password || !role) {
                showNotification('Harap lengkapi semua data wajib!', 'error');
                return;
            }

            try {
                // 1. Cek apakah email sudah terdaftar
                const existingWarga = await WARGA_COLLECTION.where('email', '==', email).get();
                if (!existingWarga.empty) {
                    showNotification('Email ini sudah terdaftar sebagai warga.', 'error');
                    return;
                }

                // 2. Simpan warga baru ke Firestore
                const newWargaData = {
                    nama: nama,
                    alamat: alamat,
                    role: role, // ⬅️ NEW: Simpan role di Firestore
                    email: email,
                    password: password, 
                    pekerjaan: 'Belum Diisi',
                    status: 'Aktif',
                    whatsapp: '',
                    referral: '',
                };

                await WARGA_COLLECTION.add(newWargaData);
                
                showNotification(`Pendaftaran ${nama} (${role.toUpperCase()}) berhasil!`, 'success');
                document.getElementById('form-register').reset();
                switchTab('login'); // Arahkan kembali ke login setelah sukses
                
            } catch (error) {
                console.error("Gagal mendaftar warga:", error);
                showNotification('Gagal mendaftar. Cek koneksi atau konsol.', 'error');
            }
        });
        
        // =======================================================
        // HANDLE LOGIN 
        // =======================================================
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!email || !password) {
                showNotification('Email dan Password wajib diisi.', 'error');
                return;
            }

            try {
                // 1. Cari warga di Firestore
                const querySnapshot = await WARGA_COLLECTION
                    .where('email', '==', email)
                    .where('password', '==', password)
                    .limit(1)
                    .get();

                if (!querySnapshot.empty) {
                    // Jika login sukses
                    const user = { id: querySnapshot.docs[0].id, ...querySnapshot.docs[0].data() };
                    
                    // Simpan status login ke Session Storage
                    sessionStorage.setItem('loggedInUser', JSON.stringify(user));
                    
                    showNotification(`Selamat datang, ${user.nama}! (Role: ${user.role.toUpperCase()})`, 'success');
                    
                    // Redirect ke halaman utama aplikasi
                    setTimeout(() => {
                        window.location.href = 'index.html'; 
                    }, 500);

                } else {
                    showNotification('Email atau Password salah. Coba lagi.', 'error');
                }

            } catch (error) {
                console.error("Error saat login:", error);
                showNotification('Terjadi error saat mencoba login.', 'error');
            }
        });

    </script>
</body>
</html>
